name: IvyPlayTV v2 Build

on:
  push:
    branches: [ivyplay-tv-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ivyplay-tv-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IvyPlayTV fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure YouTube profiles route through TV Home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/nuvio/tv/ui/navigation/NuvioNavHost.kt')
          text = path.read_text()

          import_line = 'import com.nuvio.tv.ui.screens.youtube.IvyPlayYouTubeHomeGate\n'
          anchor_import = 'import com.nuvio.tv.ui.screens.home.HeroBackdropState\n'
          if import_line not in text:
              if anchor_import not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(anchor_import, anchor_import + import_line, 1)

          if '            IvyPlayYouTubeHomeGate(\n' not in text:
              start = '            HomeScreen(\n'
              if start not in text:
                  raise SystemExit('HomeScreen start anchor not found')
              text = text.replace(
                  start,
                  '            IvyPlayYouTubeHomeGate(\n'
                  '                navController = navController,\n'
                  '                standardContent = {\n'
                  '                    HomeScreen(\n',
                  1,
              )

              end = '''                onNavigateToFolderDetail = { collectionId, folderId ->
                    navController.navigate(Screen.FolderDetail.createRoute(collectionId, folderId))
                }
            )
        }

        composable(
'''
              replacement = '''                onNavigateToFolderDetail = { collectionId, folderId ->
                    navController.navigate(Screen.FolderDetail.createRoute(collectionId, folderId))
                }
                    )
                }
            )
        }

        composable(
'''
              if end not in text:
                  raise SystemExit('HomeScreen end anchor not found')
              text = text.replace(end, replacement, 1)

          path.write_text(text)
          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/nuvio/tv/ui/navigation/NuvioNavHost.kt
            git commit -m 'feat(ivyplaytv): route YouTube profiles through TV home'
            git push origin HEAD:ivyplay-tv-v2
            exit 0
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build IvyPlayTV debug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload IvyPlayTV APK
        uses: actions/upload-artifact@v7
        with:
          name: IvyPlayTV-v2-debug
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
